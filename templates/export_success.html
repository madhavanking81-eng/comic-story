<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Success - ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand-logo">
      <a href="/" style="color: inherit; text-decoration: none;">🎨 ComicCraft</a>
    </div>
  </header>

  <main class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh;">
    
    <section class="glass-card" style="text-align: center; max-width: 600px;">
      <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
      <h1 class="hero-title" style="font-size: 2.8rem; margin-bottom: 1rem;">Comic Exported Successfully!</h1>
      <p class="hero-subtitle" style="margin-bottom: 2rem;">
        Your AI comic PDF has been generated and ready for offline viewing and sharing.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
        <a href="{{ pdf_path }}" download class="btn-primary">
          <span>📥 Download PDF Document</span>
        </a>
        <a href="/" class="btn-secondary" style="margin-top: 0.5rem;">
          <span>✨ Go Create Another Comic</span>
        </a>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>ComicCraft AI &copy; 2026. Built with FastAPI & Google Gemini Models.</p>
  </footer>

</body>
</html>
